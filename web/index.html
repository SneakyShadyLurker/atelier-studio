<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; script-src 'self' 'sha256-mJPgVRmg2lNOSok5JXAQykrqaumbzhf+5AebjYT4lAg='; connect-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'">
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <title>Atelier - Image Generation</title>
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/JetBrainsMono-400.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/InstrumentSerif-400.woff2" />
    <script>
      // Resolve theme synchronously before the React bundle parses to avoid a
      // flash-of-wrong-theme on first paint. localStorage('atelier.theme')
      // wins if explicitly set to 'light'|'dark'; otherwise prefers-color-
      // scheme picks the side. Stays in sync with useTheme — same key, same
      // algorithm.
      (function () {
        try {
          var stored = localStorage.getItem('atelier.theme');
          var theme = (stored === 'light' || stored === 'dark')
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
