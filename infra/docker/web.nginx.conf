server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # nginx >= 1.29.3: locations append their own add_header lines to this
    # server-level set instead of replacing it, so the security headers live
    # here once. The directive itself is inherited by every nested level.
    add_header_inherit merge;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; script-src 'self' 'sha256-mJPgVRmg2lNOSok5JXAQykrqaumbzhf+5AebjYT4lAg='; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Everything Vite emits under /assets/ is content-hashed.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fonts and favicons come from web/public under stable names (favicons
    # carry a manual ?v= bump), so they get a moderate max-age, not immutable.
    location ~ ^/(?:fonts/[^/]+\.woff2|favicon-(?:16|32)\.png|apple-touch-icon\.png)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
