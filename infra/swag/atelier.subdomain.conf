## Atelier SWAG proxy-conf.
## Drops into /config/nginx/proxy-confs/ on the SWAG container.
##
## OPERATOR ACTION REQUIRED — substitute the trusted-proxy-key placeholder
## before nginx reloads (SWAG does NOT envsubst proxy-confs at boot, so the
## file must be syntactically valid as deployed):
##
##   TRUSTED_PROXY_KEY=$(grep '^TRUSTED_PROXY_KEY=' /path/to/atelier/.env | cut -d= -f2-)
##   sed -i "s|__TRUSTED_PROXY_KEY__|$TRUSTED_PROXY_KEY|" \
##     /path/to/swag/nginx/proxy-confs/atelier.subdomain.conf
##   docker exec swag nginx -t   # MUST succeed before reload
##   docker exec swag nginx -s reload
##
## Optional: change the public subdomain prefix. `server_name atelier.*;`
## matches `atelier.<your-domain>`. To use a different prefix (e.g.
## `images.your-domain`), sed the line first:
##   sed -i 's|server_name atelier\.\*|server_name images.*|' atelier.subdomain.conf
##
## Why the placeholder is `__TRUSTED_PROXY_KEY__` and not `${...}`:
## nginx parses `${name}` as variable interpolation and rejects the config
## with `unknown "..." variable` at parse time. The double-underscore form
## keeps the source syntactically valid until the operator's sed.
##
## Why proxy.conf is included at server scope (not per-location):
## SWAG's bundled `proxy.conf` declares `proxy_buffering on` and 240s
## timeouts. The /api/ block needs `proxy_buffering off` and 600s timeouts
## for SSE. nginx errors on duplicate `proxy_buffering` at the SAME scope,
## so we include proxy.conf once at server scope and let /api/ override at
## location scope (server -> location inheritance is the standard pattern).
##
## DO NOT commit a substituted copy.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name atelier.*;

    include /config/nginx/ssl.conf;
    include /config/nginx/proxy.conf;
    client_max_body_size 50M;
    # Include /config/nginx/atelier-privacy.conf at http scope first.
    access_log /config/log/nginx/atelier_access.log atelier_private;
    # nginx error messages can quote request URIs and query parameters.
    error_log /dev/null;
    client_body_temp_path /tmp/atelier-body 1 2;
    client_body_buffer_size 64k;

    # Clear Remote-* before auth_request — defense against client spoofing.
    # Requires headers-more-nginx-module, included in the LinuxServer SWAG image.
    more_clear_input_headers Remote-User Remote-Groups Remote-Name Remote-Email;

    # Authelia auth_request.
    include /config/nginx/authelia-server.conf;

    # ipv6=off: Docker's embedded DNS returns BOTH A and AAAA records for
    # service names on dual-stack networks. nginx's dynamic resolver picks
    # one per resolution, so requests intermittently target the upstream's
    # IPv6 address — but Bun.serve binds to 0.0.0.0 (IPv4 only) by default,
    # so the IPv6 path returns "connect refused (111)". Pin to IPv4 and the
    # flip-flop disappears.
    location / {
        include /config/nginx/authelia-location.conf;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $upstream_app atelier-web;
        set $upstream_port 80;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    location /api/ {
        include /config/nginx/authelia-location.conf;
        proxy_request_buffering off;
        proxy_http_version 1.1;

        # SSE-friendly proxying for /api/generate. Overrides server-scope
        # proxy.conf defaults (proxy_buffering on, 240s timeouts).
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Edge gzip for JSON payloads (history, prompts, models). SSE streams
        # use Content-Type text/event-stream which is intentionally excluded
        # from gzip_types so they pass through identity-encoded. Belt-and-
        # braces: api/src/lifecycle/sse.ts also sets `Content-Encoding: identity`
        # and `Cache-Control: no-transform` on SSE responses, which nginx's
        # gzip module honours (no-transform short-circuits gzip even if the
        # type were ever to match). gzip_min_length 1024 skips tiny payloads
        # (auth probes, 304s) where the overhead would exceed the saving.
        gzip on;
        gzip_proxied any;
        gzip_types application/json text/plain;
        gzip_min_length 1024;
        gzip_vary on;

        # Defense in depth: SWAG injects the trusted proxy key. atelier-api
        # refuses requests without it. The operator-side sed above replaces
        # __TRUSTED_PROXY_KEY__ with the secret. Do NOT use ${...} syntax —
        # nginx parses that as variable interpolation and would reject the
        # config at boot.
        proxy_set_header X-Atelier-Proxy-Key "__TRUSTED_PROXY_KEY__";

        # Forward the public host explicitly. atelier-api's CSRF guard
        # compares Origin/Referer host against the request's Host header;
        # if a future SWAG image change drops the bundled proxy.conf's
        # `proxy_set_header Host $host;`, every same-origin POST would
        # otherwise be rejected as cross-origin.
        proxy_set_header Host $host;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $upstream_app atelier-api;
        set $upstream_port 8787;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
