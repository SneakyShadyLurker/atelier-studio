<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atelier — Image Generation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef;
    --bg-elev: #fbfaf6;
    --bg-sunk: #efece5;
    --ink: #14130f;
    --ink-2: #4a4942;
    --ink-3: #6c6a62;
    --line: #e3dfd5;
    --line-2: #d0ccc0;
    /* Resting boundary for INTERACTIVE controls only (buttons, icon
       buttons). --line/--line-2 are decorative dividers and exempt from
       WCAG 1.4.11; a control boundary is not, and --line-2 measures
       1.54:1 on --bg-elev. Lightest warm grey clearing 3:1 against every
       surface a control boundary touches: --bg, --bg-elev, and --bg-sunk
       (which is .icon's own fill, i.e. the border's INNER neighbour). */
    --line-control: #8d877a;
    --accent: oklch(53% 0.12 38);
    --accent-soft: oklch(94% 0.02 38);
    --glass-surface: color-mix(in srgb, var(--bg-elev) 82%, transparent);
    --glass-blur: blur(20px) saturate(1.4);
    --danger: oklch(50% 0.14 25);
    --danger-soft: oklch(94% 0.02 25);
    --good: oklch(58% 0.10 145);
    --good-on-ink: oklch(78% 0.14 145);
    --radius-3: 3px;
    --radius-4: 4px;
    --radius: 6px;
    --radius-7: 7px;
    --radius-lg: 10px;
    --radius-14: 14px;
    --shadow-1: 0 1px 0 rgba(20,19,15,0.04), 0 1px 2px rgba(20,19,15,0.04);
    --shadow-2: 0 8px 28px -10px rgba(20,19,15,0.18), 0 2px 6px rgba(20,19,15,0.06);
    --shadow-3: 0 30px 80px -20px rgba(20,19,15,0.35), 0 8px 20px rgba(20,19,15,0.10);
    --shadow-2-up: 0 -8px 28px -10px rgba(20,19,15,0.18), 0 -2px 6px rgba(20,19,15,0.06);
    --scrim: rgba(20,19,15,0.4);
    --scrim-soft: rgba(20,19,15,0.32);
    --scrim-tile: rgba(20,19,15,0.55);
    --scrim-control: rgba(20,19,15,0.6);
    --scrim-panel: rgba(20,19,15,0.7);
    --scrim-strong: rgba(20,19,15,0.85);
    --scrim-scan: rgba(20,19,15,0.06);
    --scrim-on-image: rgba(0,0,0,0.32);
    --shadow-text-on-image: 0 1px 2px rgba(0,0,0,0.55);
    --glass-on-dark-6: rgba(255,255,255,0.06);
    --glass-on-dark-8: rgba(255,255,255,0.08);
    --glass-on-dark-10: rgba(255,255,255,0.10);
    --glass-on-dark-12: rgba(255,255,255,0.12);
    --glass-on-dark-15: rgba(255,255,255,0.15);
    --glass-on-dark-34: rgba(255,255,255,0.34);
    --glass-on-dark-35: rgba(255,255,255,0.35);
    --glass-on-dark-65: rgba(255,255,255,0.65);
    --glass-on-dark-70: rgba(255,255,255,0.7);
    --glass-on-dark-75: rgba(255,255,255,0.75);
    --glass-on-dark-85: rgba(255,255,255,0.85);
    --glass-on-dark-90: rgba(255,255,255,0.9);
    --glass-on-dark-100: rgba(255,255,255,1);
    --shadow-photo: 0 40px 100px -20px rgba(0,0,0,0.5);
    /* Focus ring color. Light mode = --ink (deep ink on cream — handoff spec).
       Dark theme overrides to --ink-2 so focus stays clearly active without
       flashing near-white against the warm-dark surface. */
    --focus-ring: var(--ink);
    --z-popover: 50;
    --z-lightbox: 100;
    --z-toast: 200;
    --z-confirm: 250;
    --z-composer: 5;
    --z-drawer: 10;
    --z-overlay-max: 1000;
    --sidebar-width: 240px;
    --app-header-h: 56px;
    --tile-min: clamp(220px, 18vw, 320px);
    --tile-cap: 72dvh;
    --grid-gap: 14px;
    --ease-out: cubic-bezier(.2,.8,.2,1);
    --ease-tactile: cubic-bezier(.34,1.56,.64,1);
    --dur-hover: 120ms;
    --dur-overlay: 160ms;
    --dur-transform: 200ms;
    --dur-entrance: 380ms;
    --dur-sheet: 240ms;
    --dur-settle: 280ms;
    --dur-rise: 420ms;
    --dur-reveal: 500ms;
    --dur-reduced: 80ms;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
    --text-2xs: 0.6875rem;
    --text-xs: 0.75rem;
    --text-sm: 0.8125rem;
    --text-md: 0.9375rem;
    --text-base: 1rem;
    --text-lg: 1.0625rem;
    --text-xl: 1.25rem;
    --text-display: 1.75rem;
    --bp-phone: 767px;
  }
  @media (max-width: 767px) {
    :root {
      --tile-cap: 70dvh;
      --grid-gap: 10px;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font-family: inherit; font-size: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  ::selection { background: var(--ink); color: var(--bg); }

  #root { height: 100%; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script>
    // Load JSX manually then hand to Babel — sidesteps the in-browser Babel src loader,
    // which fails on some serving contexts.
    (async () => {
      const res = await fetch('app.js');
      const code = await res.text();
      const s = document.createElement('script');
      s.type = 'text/babel';
      s.setAttribute('data-presets', 'react');
      s.textContent = code;
      document.body.appendChild(s);
      // Trigger babel transform
      if (window.Babel) {
        window.Babel.transformScriptTags();
      }
    })();
  </script>
</body>
</html>
